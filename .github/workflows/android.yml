name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*.*.*"
      - "v*.*.*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PAWTRACK_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A release keystore is only present as a repo secret once one has
      # been generated (see android/RELEASING.md). Without it, this step is
      # skipped and the build below falls back to debug signing — good
      # enough to verify the app compiles on every push, even before the
      # first real release is cut.
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          PAWTRACK_KEYSTORE_B64: ${{ secrets.PAWTRACK_KEYSTORE_B64 }}
        run: echo "$PAWTRACK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        working-directory: android
        env:
          PAWTRACK_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          PAWTRACK_KEYSTORE_PASSWORD: ${{ secrets.PAWTRACK_KEYSTORE_PASSWORD }}
          PAWTRACK_KEY_ALIAS: ${{ secrets.PAWTRACK_KEY_ALIAS }}
          PAWTRACK_KEY_PASSWORD: ${{ secrets.PAWTRACK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawtrack-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      # Every tagged release — whether it's an Android-only tag (android-v*)
      # or a main web app tag (v*) — should end up with the current APK
      # attached, so "Releases" always has something installable. Uses the
      # gh CLI directly (not softprops/action-gh-release) specifically so it
      # never touches an existing release's title/notes: `gh release upload`
      # only adds/replaces the asset file, leaving everything else alone —
      # important since web releases already get hand-written notes from a
      # separate `gh release create` step in the normal release process.
      - name: Attach APK to this tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$TAG" == android-v* ]]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "PawTrack Android $TAG" \
                --notes "PawTrack Android companion app — self-signed APK for sideloading (no Play Store account needed).

          Install: download the APK below, allow \"install from unknown sources\" for your browser/file manager, then install it. On first launch, enter your PawTrack server's address."
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
            fi
          fi
          gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --repo "$GITHUB_REPOSITORY" --clobber
